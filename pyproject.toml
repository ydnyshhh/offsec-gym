[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "offsecgym"
version = "0.1.0"
description = "Research infrastructure for autonomous agents in isolated synthetic security ranges"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
offsecgym = "offsecgym.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/offsecgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "postgres: requires a PostgreSQL test database",
  "docker: requires a local Docker daemon",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
