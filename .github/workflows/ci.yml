name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: offsecgym_test
          POSTGRES_PASSWORD: offsecgym_test
          POSTGRES_DB: offsecgym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offsecgym_test -d offsecgym_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OFFSECGYM_DATABASE_URL: postgresql+asyncpg://offsecgym_test:offsecgym_test@localhost:5432/offsecgym_test
      OFFSECGYM_TEST_DATABASE_URL: postgresql+asyncpg://offsecgym_test:offsecgym_test@localhost:5432/offsecgym_test
      OFFSECGYM_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.28
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Apply schema migrations
        run: uv run --locked alembic upgrade head
      - name: Test
        run: uv run --locked pytest -q
